version: "3"
tasks:
  check:
    cmds:
      - cargo fmt --all --check
      - cargo clippy --locked --workspace --all-targets -- -D warnings
  test:
    cmds: [cargo test --locked --workspace]
  console:install:
    dir: console
    cmds: [bun install --frozen-lockfile]
  console:check:
    dir: console
    deps: [console:install]
    cmds: [bun run format:check, bun run check]
  console:build:
    dir: console
    deps: [console:install]
    cmds: [bun run build]
  ci-agent:install:
    dir: ci-agent
    cmds: [npm ci]
  ci-agent:check:
    dir: ci-agent
    deps: [ci-agent:install]
    cmds: [npm run lint, npm run check, npm run build]
  ci-agent:test:
    dir: ci-agent
    deps: [ci-agent:install]
    cmds: [npm test]
  verify:
    deps: [check, test, console:check, console:build, ci-agent:check, ci-agent:test]
